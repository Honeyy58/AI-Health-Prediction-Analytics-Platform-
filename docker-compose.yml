version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: health-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-healthpass123}
      MYSQL_DATABASE: ${DB_NAME:-health_prediction}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-healthpass123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - health-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: health-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-healthpass123}
      DB_NAME: ${DB_NAME:-health_prediction}
      HOST: 0.0.0.0
      PORT: 8000
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    networks:
      - health-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: health-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - health-net

volumes:
  mysql_data:
    driver: local

networks:
  health-net:
    driver: bridge
